$kind: http-request
description: ""
url: "{{baseUrl}}/users/:user_id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: user_id
    value: "9492"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "title": "User Id",
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "role": null,
      "is_active": true
    }
  $type: |-
    {
      "description": "Admin changes a user. Every field is optional (send only what changes).",
      "title": "UserUpdate",
      "type": "object",
      "properties": {
        "role": {
          "title": "Role",
          "anyOf": [
            {
              "type": "string",
              "enum": [
                "admin",
                "staff",
                "user"
              ]
            },
            {
              "type": "null"
            }
          ]
        },
        "is_active": {
          "title": "Is Active",
          "anyOf": [
            {
              "type": "boolean"
            },
            {
              "type": "null"
            }
          ]
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update User.resources/examples
order: 2000
