$kind: http-request
description: Public sign-up. The role is always 'user'.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "tdt9skCBl4@SJZPxTUMC.fbmv",
      "password": "stringstring"
    }
  $type: |-
    {
      "description": "Public sign-up. There is NO role field here on purpose:\nif there were, anyone could register themselves as admin (mass assignment attack).\nThe service layer will always set role = \"user\" for this route.",
      "title": "UserCreate",
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "title": "Email",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 8,
          "maxLength": 72,
          "title": "Password"
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Register.resources/examples
order: 1000
