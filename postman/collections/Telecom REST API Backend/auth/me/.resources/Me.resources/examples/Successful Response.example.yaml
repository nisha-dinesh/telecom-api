$kind: http-example
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 7558,
        "email": "RHKErGimVI5UZ@SMwuujtSpCRqcBtLhRgTzPAjnqhO.ho",
        "role": "string",
        "is_active": false,
        "created_at": "2021-12-01T14:23:14.260Z"
      }
    $type: |-
      {
        "description": "What we send back. Notice: NO hashed_password field here.",
        "title": "UserRead",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "title": "Id"
          },
          "email": {
            "type": "string",
            "title": "Email",
            "format": "email"
          },
          "role": {
            "type": "string",
            "title": "Role"
          },
          "is_active": {
            "type": "boolean",
            "title": "Is Active"
          },
          "created_at": {
            "type": "string",
            "title": "Created At",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "email",
          "role",
          "is_active",
          "created_at"
        ]
      }
order: 1000
