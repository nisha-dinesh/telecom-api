$kind: http-request
description: Email + password in, JWT out.Only 5 tries per minute, to slow down brute-force attacks.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "1GLo18QjZO7Q@KTTZI.avov",
      "password": "string"
    }
  $type: |-
    {
      "description": "What the client sends to log in.",
      "title": "LoginRequest",
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "title": "Email",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 1,
          "maxLength": 72,
          "title": "Password"
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Login.resources/examples
order: 1000
