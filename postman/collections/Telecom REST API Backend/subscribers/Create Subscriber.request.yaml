$kind: http-request
description: ""
url: "{{baseUrl}}/subscribers"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "msisdn": "8464602048",
      "name": "string",
      "circle_id": 5185,
      "plan_id": null,
      "user_id": 6329
    }
  $type: |-
    {
      "description": "What the client sends to add a subscriber.\nNo 'status' here: a new subscriber always starts as 'active' (set by the service).",
      "title": "SubscriberCreate",
      "type": "object",
      "properties": {
        "msisdn": {
          "type": "string",
          "pattern": "^[6-9]\\d{9}$",
          "title": "Msisdn"
        },
        "name": {
          "type": "string",
          "minLength": 2,
          "maxLength": 100,
          "title": "Name"
        },
        "circle_id": {
          "type": "integer",
          "title": "Circle Id"
        },
        "plan_id": {
          "title": "Plan Id",
          "anyOf": [
            {
              "type": "integer"
            },
            {
              "type": "null"
            }
          ]
        },
        "user_id": {
          "title": "User Id",
          "anyOf": [
            {
              "type": "integer"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "msisdn",
        "name",
        "circle_id"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create Subscriber.resources/examples
order: 1000
