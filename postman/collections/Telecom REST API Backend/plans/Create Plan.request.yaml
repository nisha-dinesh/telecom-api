            {
              "type": "string"
            }
          ]
        },
        "validity_days": {
          "type": "integer",
          "title": "Validity Days"
        },
        "data_mb_per_day": {
          "type": "integer",
          "minimum": 0,
          "title": "Data Mb Per Day"
        },
        "voice_minutes": {
