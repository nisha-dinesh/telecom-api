$kind: http-example
request:
  url: "{{baseUrl}}/usage"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "subscriber_id": 8442,
        "usage_date": "1968-03-23T04:01:38.868Z",
        "raw_value": 971749.9515350679,
        "unit": "MB"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 4357,
        "subscriber_id": 4931,
        "usage_date": "1963-04-17T00:07:22.432Z",
        "raw_value": 1776.0620067584198,
        "unit": "string",
        "data_mb": 6288.150916119783
      }
    $type: |-
      {
        "description": "What we send back. data_mb is the converted value (1 GB = 1024 MB).",
        "title": "UsageRead",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "title": "Id"
          },
          "subscriber_id": {
            "type": "integer",
            "title": "Subscriber Id"
          },
          "usage_date": {
            "type": "string",
            "title": "Usage Date",
            "format": "date-time"
          },
          "raw_value": {
            "type": "number",
            "title": "Raw Value"
          },
          "unit": {
            "type": "string",
            "title": "Unit"
          },
          "data_mb": {
            "type": "number",
            "title": "Data Mb"
          }
        },
        "required": [
          "id",
          "subscriber_id",
          "usage_date",
          "raw_value",
          "unit",
          "data_mb"
        ]
      }
order: 1000
