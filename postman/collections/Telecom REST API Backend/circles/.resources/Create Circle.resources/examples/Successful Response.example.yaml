$kind: http-example
request:
  url: "{{baseUrl}}/circles"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 9707,
        "name": "string"
      }
    $type: |-
      {
        "description": "What we send back to the client.",
        "title": "CircleRead",
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "title": "Id"
          },
          "name": {
            "type": "string",
            "title": "Name"
          }
        },
        "required": [
          "id",
          "name"
        ]
      }
order: 1000
